# ==============================
# Aplicacao
# ==============================
spring.application.name=flowboard-api
server.port=8083

# ==============================
# Banco de dados (PostgreSQL via Docker Compose local)
# ==============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/flowboard_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:flowboard_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:flowboard_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# JWT
# ==============================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ==============================
# Swagger / OpenAPI
# ==============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ==============================
# Kafka
# ==============================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=flowboard-api
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.guilherme.flowboard_api.dto
spring.kafka.consumer.auto-offset-reset=earliest

# ==============================
# Logging
# ==============================
logging.level.com.guilherme.flowboard_api=DEBUG
logging.level.org.springframework.web.socket=DEBUG

# ==============================
# Rate Limiting (Resilience4j)
# ==============================
resilience4j.ratelimiter.instances.login.limit-for-period=5
resilience4j.ratelimiter.instances.login.limit-refresh-period=1m
resilience4j.ratelimiter.instances.login.timeout-duration=0

# ==============================
# Request Size Limits
# ==============================
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
server.tomcat.max-swallow-size=1MB
server.tomcat.max-http-form-post-size=1MB

# Metrics / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name:flowboard-api}
